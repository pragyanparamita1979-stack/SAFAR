<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore India — SafarAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav-wrap inner-nav">
    <nav class="nav-shell">
      <a class="brand" href="index.html"><span class="brand-mark">S</span>SAFAR<span class="brand-ai">AI</span></a>
      <button class="menu-button" type="button" aria-expanded="false">Menu</button>
      <div class="nav-links">
        <a href="index.html">Home</a><a class="active" href="explore.html">Explore</a><a href="planner.html">AI Planner</a><a href="index.html#about">About</a>
      </div>
      <a class="nav-cta" href="planner.html">Plan a journey <span>↗</span></a>
    </nav>
  </header>

  <main>
    <section class="page-heading">
      <p class="eyebrow dark"><span></span> Curated places</p>
      <h1>Where will <em>curiosity</em><br>take you?</h1>
      <div class="search-row">
        <label class="search-box"><span>⌕</span><input id="search" type="search" placeholder="Search place, state or experience"></label>
        <button class="search-button" type="button" onclick="showPlaces()">Search</button>
      </div>
      <div class="state-filter-row">
        <label for="stateFilter">Browse by state or union territory</label>
        <select id="stateFilter" onchange="filterByState(this.value)">
          <option value="All">All states and union territories</option>
        </select>
      </div>
    </section>
    <div class="filters">
      <button class="active" type="button" onclick="filterPlaces('All')">All places</button>
      <button type="button" onclick="filterPlaces('Forest')">Forests</button>
      <button type="button" onclick="filterPlaces('Mountain')">Mountains</button>
      <button type="button" onclick="filterPlaces('Waterfall')">Waterfalls</button>
      <button type="button" onclick="filterPlaces('Beach')">Beaches</button>
      <button type="button" onclick="filterPlaces('Flower')">Flower areas</button>
      <button type="button" onclick="filterPlaces('Lake')">Lakes</button>
    </div>
    <section class="cards-section"><div id="placeList" class="destination-grid"></div></section>
  </main>

  <footer><a class="brand footer-brand" href="index.html"><span class="brand-mark">S</span>SAFAR<span class="brand-ai">AI</span></a><p>India, thoughtfully discovered.</p></footer>
  <script src="script.js"></script>
</body>
</html>
